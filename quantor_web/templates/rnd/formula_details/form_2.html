    <h3>FInding the standard normal CDF</h3>
    <p style="font-size: larger;">
        \[
        \Phi(z)
        \;=\;
        P(Z \le z)
        \;=\;
        \int_{-\infty}^{z}
        \frac{1}{\sqrt{2\pi}}
        \,e^{-t^{2}/2}\,dt
        \]
    </p>
    <h3>FInding the normal CDF</h3>
    <p style="font-size: larger;">
        \[
        P(X \le x)
        \;=\;
        \Phi\!\left(\frac{x-\mu}{\sigma}\right)
        \]
    </p>
